aid: amplify-md
name: Amplify MD
description: 'AmplifyMD is a healthcare technology company providing an EHR-integrated
  virtual care platform that helps hospitals and health systems build, manage, and
  scale high-quality virtual care across emergent, inpatient, asynchronous, virtual
  clinic, and direct-to-patient settings. The company operates a nationwide network
  of remote specialists across 15+ medical fields, reporting 400+ active programs,
  a 50-state footprint, and 220,000+ annual consults. It was surfaced as a portfolio
  company of Greylock and added to the API Evangelist network for enrichment; the
  company publishes a marketing site and an app login but no public developer/API
  surface was found during enrichment.'
